id: CVE-2024-TEST-005
info:
  name: Dangerous eval() Usage in Python
  author: Sirius Scan
  severity: critical
  description: Detects use of eval() which can lead to arbitrary code execution
  references:
    - https://owasp.org/www-community/attacks/Code_Injection
  cve:
    - CVE-2024-TEST-005
  tags:
    - python
    - code-injection
    - eval
  version: "1.0.0"

detection:
  logic: all
  steps:
    - type: file_content
      platforms:
        - linux
        - darwin
        - windows
      weight: 1.0
      config:
        path: testing/test-data/vulnerable-code.py
        regex: '\beval\s*\('

