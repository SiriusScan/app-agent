id: CVE-2024-TEST-004
info:
  name: Weak Password in Configuration
  author: Sirius Scan
  severity: high
  description: Detects weak or default passwords in configuration files
  references:
    - https://owasp.org/www-project-top-ten/2017/A2_2017-Broken_Authentication
  tags:
    - password
    - configuration
    - security
  version: "1.0.0"

detection:
  logic: any
  steps:
    - type: file_content
      platforms:
        - linux
        - darwin
        - windows
      weight: 1.0
      config:
        path: testing/test-data/vulnerable-config.conf
        regex: 'password\s*=\s*(admin|password|123|root|admin123)'

