name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GOPRIVATE
        run: echo "GOPRIVATE=github.com/SiriusScan/*" >> $GITHUB_ENV

      - name: Install dependencies
        run: go mod download

      - name: Build binaries
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: SiriusScan Agent ${{ github.ref_name }}
          body: |
            ## SiriusScan Agent Release ${{ github.ref_name }}

            ### What's New
            - Cross-platform agent builds for Linux, Windows, and macOS
            - Improved command processing and scripting support
            - Enhanced status reporting capabilities
            - Apple Silicon (ARM64) support for macOS devices

            ### Downloads
            - **Linux (amd64)**: `sirius-agent-linux-amd64`
            - **Windows (amd64)**: `sirius-agent-windows-amd64.exe`
            - **macOS (ARM64 - Apple Silicon)**: `sirius-agent-darwin-arm64`

            ### Installation
            1. Download the appropriate binary for your platform
            2. Make it executable (Linux/Mac): `chmod +x sirius-agent-*`
            3. Configure your environment variables or config file
            4. Run the agent: 
               - Linux: `./sirius-agent-linux-amd64`
               - Windows: `sirius-agent-windows-amd64.exe`
               - macOS: `./sirius-agent-darwin-arm64`

          files: |
            bin/sirius-agent-linux-amd64
            bin/sirius-agent-windows-amd64.exe
            bin/sirius-agent-darwin-arm64
          draft: false
          prerelease: false
