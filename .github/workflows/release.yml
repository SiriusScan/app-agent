# Release workflow for Sirius Agent
# Triggers on tag push (v*) or manual dispatch
# Uses GoReleaser to build and publish multi-platform binaries

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Verify release artifacts
  verify:
    name: Verify Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        run: |
          # Get the tag name
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "refs/heads/main" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          
          echo "Verifying release: $TAG"
          
          # Download checksums
          curl -sL "https://github.com/SiriusScan/app-agent/releases/download/${TAG}/checksums.txt" -o checksums.txt
          
          echo "Release checksums:"
          cat checksums.txt

      - name: Verify Linux amd64 binary
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "refs/heads/main" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          
          curl -sL "https://github.com/SiriusScan/app-agent/releases/download/${TAG}/sirius-agent_${TAG#v}_linux_amd64.tar.gz" -o sirius-agent.tar.gz
          tar xzf sirius-agent.tar.gz
          ./sirius-agent --help
          echo "Linux amd64 binary verified successfully"
